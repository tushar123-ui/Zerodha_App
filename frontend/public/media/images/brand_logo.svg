<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Yeh mask us curve wali line ko transparent (cut out) banayega -->
    <mask id="cutout">
      <!-- White (visible) rectangle for the full background -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- Black (hidden) stroke for the curved line to cut it out -->
      <circle cx="10" cy="90" r="85" fill="none" stroke="black" stroke-width="10" />
    </mask>
  </defs>

  <!-- Yeh actual blue shape hai jispar mask apply ho raha hai -->
  <g mask="url(#cutout)">
    <rect x="10" y="10" width="80" height="80" fill="#3D7DDB" />
  </g>
</svg>